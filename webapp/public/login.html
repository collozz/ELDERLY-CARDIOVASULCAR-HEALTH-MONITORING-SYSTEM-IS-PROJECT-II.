<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Log in · Elderly Heart Monitor</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f1b3d" />
  <link rel="icon" type="image/png" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Heart Monitor" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-box">
      <div class="logo">
        <span class="heart" aria-hidden="true">♥</span>
        <span class="title">Elderly Heart Rate Monitoring &amp; Emergency Alert System</span>
        <span class="muted small">Log in to continue</span>
      </div>

      <form id="login-form">
        <label>Email address
          <input type="email" name="email" id="email" autocomplete="username" required />
        </label>
        <label>Password
          <input type="password" name="password" id="password" autocomplete="current-password" required />
        </label>
        <p class="msg error" id="msg" hidden></p>
        <button class="btn primary" type="submit">Log in</button>
      </form>

      <p class="muted small" style="text-align:center;margin:0">
        No account yet? <a href="register.html">Register</a>
      </p>
      <button class="btn light install-btn" type="button" hidden>Install the app on this device</button>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script>
    // Already logged in
    fetch('/api/auth/session').then((r) => r.json()).then((d) => { if (d.user) location.href = homePage(d.user); }).catch(() => {});

    $('#login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      showMsg($('#msg'), '');
      try {
        const { user } = await api('/api/auth/login', { method: 'POST', body: formData(e.target) });
        location.href = homePage(user);
      } catch (err) {
        showMsg($('#msg'), err.message);
      }
    });
  </script>
</body>
</html>
