<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dashboard · Elderly Heart Monitor</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f1b3d" />
  <link rel="icon" type="image/png" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Heart Monitor" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <div class="shell">
    <nav class="sidenav" id="nav"></nav>
    <main class="content">
      <div class="page-head">
        <div>
          <h1 id="greeting">Dashboard</h1>
          <p class="muted" id="today" style="margin:4px 0 0"></p>
        </div>
        <button class="btn light small" id="episode-btn" type="button" hidden title="Makes the built-in simulator produce abnormal readings">Simulate abnormal episode</button>
      </div>

      <div id="banner"></div>

      <div class="card setting-row" id="push-tip" hidden>
        <span><strong>Get alerts on this device.</strong> <span class="muted">A pop-up appears even when the app is closed.</span></span>
        <button class="btn primary small" type="button" id="push-tip-btn">Turn on notifications</button>
      </div>

      <section class="grid-4" id="overview" hidden></section>

      <section>
        <div class="section-label" id="people-label">Assigned elderly · live status</div>
        <div class="people" id="people"><p class="muted">Loading…</p></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Weekly heart rate trend</h2>
          <div class="legend" id="trend-legend"></div>
        </div>
        <canvas class="chart" id="trend"></canvas>
        <p class="muted small" style="margin:8px 0 0">Daily average heart rate (BPM) over the last 7 days. The green band is the normal range 50–100 BPM.</p>
      </section>
    </main>
  </div>

  <script src="js/common.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
